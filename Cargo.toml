[package]
name = "flagscan"
version = "0.3.0"
description = "Auto-scan files and folders for CTF flags through chained decoders"
license = "MIT"
repository = "https://github.com/MadginCode/Flagscan"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bzip2 = "0.6.1"
clap = { version = "4.6.10", features = ["derive"] }
data-encoding = "2.11.1"
dirs = "7.0.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "tiff", "webp"] }
kamadak-exif = "0.6.2"
lzma-rs = "0.3.0"
memchr = "2.8.3"
percent-encoding = "2.3.2"
regex = "1.13.2"
rustfft = "6.4.1"
ruzstd = "0.9.1"
rxing = { version = "0.9.4", default-features = false, features = ["multi_barcode_readers", "qrcode", "datamatrix", "aztec", "pdf417", "oned", "encoding_rs"] }
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "native-certs", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress", "aes256", "bzip2"] }
sha2 = "0.11.2"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4"] }
walkdir = "2.5.1"
webbrowser = "1.2.7"
zip = { version = "9.8.2", default-features = false, features = ["deflate", "deflate64", "aes-crypto"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
