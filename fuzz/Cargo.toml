[package]
name = "flagscan-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flagscan = { path = ".." }

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

# Standalone workspace so the fuzz crate stays out of the main build and its lockfile.
[workspace]
